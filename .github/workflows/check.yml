name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile and selftest
        run: |
          python -m py_compile scripts/session.py scripts/file_translation.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: bash syntax
        run: bash -n install.sh scripts/setup.sh scripts/translate.sh
